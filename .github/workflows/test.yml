name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install` rather than `npm ci` until package-lock.json is regenerated with vitest.
      - run: npm install --no-audit --no-fund
      - run: npm test
